name: Seans 0.2 mobile and public tests
on:
  push:
    branches: [film-duel-prototype]
    paths: ['film-duel/*.js', 'film-duel/*.css', 'film-duel/index.html', 'film-duel/test-v02.py', 'film-duel/check-public-v02.py', '.github/workflows/seans-browser-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seans-published-tests
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SEANS_PUBLIC_URL: https://raw.githack.com/KADARstudio/WycenaSesji/film-duel-prototype/film-duel/index.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Check application behaviour and the actual published URL
        run: python film-duel/test-v02.py
      - name: Archive source and browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seans-v02-published-evidence
          path: film-duel/
          retention-days: 7
