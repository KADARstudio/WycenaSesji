name: Seans 0.2 release tests
on:
  push:
    branches: [seans-v02-release]
    paths: ['film-duel/**', '.github/workflows/seans-v02-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seans-v02-release-tests
  cancel-in-progress: true
jobs:
  mobile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Verify actual source, local storage, sound, motion, statistics and public URL
        run: python film-duel/test-v02.py
      - name: Archive source and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seans-v02-test-evidence
          path: film-duel/
          retention-days: 7
