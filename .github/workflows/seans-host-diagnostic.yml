name: Seans public delivery check
on:
  push:
    branches: [seans-v02-release]
    paths: ['film-duel/check-public-v02.py', '.github/workflows/seans-host-diagnostic.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install browser tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Read actual public page and exercise a movie selection
        run: python film-duel/check-public-v02.py
      - name: Save public-page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seans-v02-public-evidence
          path: film-duel/public-test-results/
          retention-days: 7
