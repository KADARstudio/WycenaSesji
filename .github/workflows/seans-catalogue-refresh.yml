# Only the Seans prototype data are updated. No pricing application files are changed.
name: Seans hourly PL catalogue
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seans-catalogue-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: film-duel-prototype
      - name: Fetch and validate Poland subscription offers
        run: python film-duel/refresh_catalog.py
      - name: Publish data only to the prototype branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add film-duel/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified PL subscription movie catalogue'
            git pull --rebase origin film-duel-prototype
            git push origin HEAD:film-duel-prototype
          fi
